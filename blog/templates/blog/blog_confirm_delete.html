{% extends 'blog/base.html' %}
{% block title %}Create{% endblock %}
{% block content %}

<div class="container">
    <div class="row">
        <div class="col-6">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ message }}</h4>
                </div>
                <form method="post" enctype="multipart/form-data" class="form-floating">
                     <div class="card">
                    <p class="card-text">
                        Действительно ли вы хотите удалить {{ object.title }}
                    </p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn btn-danger">
                        Удалить
                    </button>
                    <a class="p-2 btn btn-outline-primary" href="{% url 'blog:blog_list' %}">Отмена</a>
                </div>
            </form>
        </div>
    </div>

{% endblock %}
